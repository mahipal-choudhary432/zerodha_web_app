<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zerodha Kite - Login</title>

    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #ffffff;
            width: 380px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00000010;
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 5px;
            font-weight: 600;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            outline: none;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            border-color: #2873f0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2873f0;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1d5ec4;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 13px;
        }

        .footer-text a {
            color: #2873f0;
            text-decoration: none;
            font-weight: 600;
        }

        /* Mobile Responsive */
        @media(max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 25px;
            }
            .logo { width: 75px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img class="logo" src="https://zerodha.com/static/images/logo.svg" alt="Zerodha Logo">

        <h2>Login to Kite</h2>
        <p>Welcome back! Please login to continue.</p>

        <input type="text" placeholder="User ID" required>
        <input type="password" placeholder="Password" required>

        <a href="dashboard.html">
            <button>Login</button>
        </a>

        <div class="footer-text">
            <p>New to Kite? <a href="#">Create Account</a></p>
        </div>
    </div>

</body>
</html>
