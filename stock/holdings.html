<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kite — IPOs</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kite:#0b5ed7;
    --muted:#98a2a8;
    --bg:#f6f8fb;
    --card:#fff;
    --border: #eef1f4;
    --success:#16a34a;
    --danger:#e11d48;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#0b1220;-webkit-font-smoothing:antialiased}
  /* header */
  .topbar{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:8px 12px}
  .indices{display:flex;gap:18px;font-size:13px;color:var(--muted);align-items:center}
  .indices .value{font-weight:700;color:#e11d48}
  .brand{margin-left:auto;display:flex;gap:10px;align-items:center}
  .circle{width:36px;height:36px;border-radius:50%;background:#f0f6ff;color:var(--kite);display:flex;align-items:center;justify-content:center;font-weight:700}
  /* page container */
  .container{max-width:940px;margin:0 auto;padding:12px}
  /* tabs */
  .tabs{display:flex;gap:14px;align-items:center;background:#fff;padding:10px;border-radius:10px;border:1px solid var(--border);overflow:auto}
  .tab{padding:8px 14px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tab.active{color:var(--kite);box-shadow:inset 0 -3px 0 rgba(11,94,215,0.08)}
  /* subtabs / search */
  .subbar{display:flex;align-items:center;gap:12px;margin-top:12px}
  .subtabs{display:flex;gap:8px;background:#fff;padding:6px;border-radius:999px;border:1px solid var(--border)}
  .sub{padding:8px 12px;border-radius:999px;color:var(--muted);cursor:pointer}
  .sub.active{background:var(--kite);color:#fff}
  .searchwrap{margin-left:auto;display:flex;gap:8px;align-items:center}
  .search{display:flex;gap:8px;border-radius:10px;padding:6px 8px;background:#fff;border:1px solid var(--border);align-items:center}
  .search input{border:none;outline:none;font-size:14px;background:transparent}
  .filterbtn{background:#fff;border:1px solid var(--border);padding:8px;border-radius:8px;cursor:pointer}
  /* list */
  .list{margin-top:12px;background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden}
  .item{display:flex;justify-content:space-between;align-items:flex-start;padding:18px;border-bottom:1px solid var(--border)}
  .item:last-child{border-bottom:none}
  .left{max-width:65%}
  .issuer{font-size:13px;color:var(--muted);margin-bottom:6px}
  .symbol{font-weight:800;font-size:16px;margin-bottom:6px}
  .price{color:#0b1220;font-weight:600}
  .dates{color:var(--muted);font-size:13px;margin-top:6px}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .apply{background:linear-gradient(180deg,var(--kite),#0749a8);color:#fff;padding:8px 12px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
  .closed{background:#f1f5f9;color:var(--muted);padding:8px 10px;border-radius:8px;font-weight:700;border:1px solid var(--border)}
  /* small screen adjustments */
  @media (max-width:480px){
    .left{max-width:60%}
    .item{padding:14px}
    .symbol{font-size:15px}
  }
  /* bottom nav mimic */
  .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center}
  .bn{max-width:940px;width:100%;display:flex;justify-content:space-around;padding:8px}
  .bn button{background:transparent;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:12px;cursor:pointer}
  .badge{background:var(--kite);color:#fff;padding:2px 6px;border-radius:12px;font-weight:700;font-size:11px}
  /* modal apply */
  .modal{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(2,6,23,0.45);display:grid;place-items:center;z-index:9999;opacity:0;pointer-events:none;transition:opacity .18s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal .box{background:#fff;padding:18px;border-radius:12px;max-width:420px;width:90%;box-shadow:0 14px 40px rgba(2,6,23,0.18);border:1px solid var(--border)}
  .modal .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="indices">
      <div>NIFTY 50 <div class="value" style="display:inline-block;margin-left:6px">25,722.10</div><div class="muted" style="display:inline-block;margin-left:6px;font-size:12px">-155.75 (-0.60%)</div></div>
      <div>NIFTY BANK <div class="value" style="display:inline-block;margin-left:6px">57,776.35</div><div class="muted" style="display:inline-block;margin-left:6px;font-size:12px">-254.75 (-0.44%)</div></div>
    </div>
    <div class="brand">
      <div style="font-size:18px;font-weight:700;color:var(--kite)">K</div>
      <div class="circle">M</div>
    </div>
  </div>

  <div class="container">
    <!-- Tabs -->
    <div class="tabs" id="mainTabs">
      <div class="tab active" data-tab="ipo">IPO <span class="badge" style="margin-left:8px">2</span></div>
      <div class="tab" data-tab="govt">Govt. securities</div>
      <div class="tab" data-tab="auctions">Auctions</div>
      <div class="tab" data-tab="corp">Corporate actions</div>
    </div>

    <!-- Subbar: search and subtabs -->
    <div class="subbar">
      <div class="subtabs" role="tablist">
        <div class="sub active" data-sub="ongoing">Ongoing</div>
        <div class="sub" data-sub="applied">Applied</div>
        <div class="sub" data-sub="upcoming">Upcoming</div>
      </div>

      <div class="searchwrap">
        <div class="search" title="Search IPOs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.7"><path d="M21 21l-4.35-4.35" stroke="#6b7680" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="#6b7680" stroke-width="1.6"/></svg>
          <input id="searchInput" placeholder="Search IPOs, company" />
        </div>
        <button class="filterbtn" id="filterBtn" title="Filters">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:.8"><path d="M22 6H2" stroke="#6b7680" stroke-width="1.6" stroke-linecap="round"/><path d="M19 12H5" stroke="#6b7680" stroke-width="1.6" stroke-linecap="round"/><path d="M15 18H9" stroke="#6b7680" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <!-- IPO list -->
    <div class="list" id="ipoList" role="list" aria-live="polite">
      <!-- dynamic items injected here -->
    </div>
  </div>

  <!-- bottom nav -->
  <div class="bottom-nav" aria-hidden="false">
    <div class="bn">
      <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 7h18" stroke="#6b7680" stroke-width="1.6" stroke-linecap="round"/></svg><div>Watchlist</div></button>
      <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="14" rx="2" stroke="#6b7680" stroke-width="1.6"/></svg><div>Orders</div></button>
      <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2v20" stroke="#6b7680" stroke-width="1.6"/><path d="M2 12h20" stroke="#6b7680" stroke-width="1.6"/></svg><div>Portfolio</div></button>
      <button><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 21h18" stroke="#6b7680" stroke-width="1.6"/><path d="M4 6h16" stroke="#6b7680" stroke-width="1.6"/></svg><div style="color:var(--kite)">Bids</div></button>

      <!-- ✅ Redirect Added Here -->
      <button onclick="window.location.href='about.html'">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3" stroke="#6b7680" stroke-width="1.6"/>
          <path d="M6 20c1.8-2 4.2-3 6-3s4.2 1 6 3" stroke="#6b7680" stroke-width="1.6"/>
        </svg>
        <div>KHH045</div>
      </button>
    </div>
  </div>

  <!-- Apply modal -->
  <div class="modal" id="applyModal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="box">
      <div style="font-weight:800;font-size:16px" id="modalTitle">Apply to IPO</div>
      <div class="muted" id="modalCompany" style="margin-top:6px">Company name</div>
      <div style="margin-top:12px">
        <label class="muted">Price band</label>
        <div style="font-weight:700;margin-top:6px" id="modalPrice">₹0 - ₹0</div>
      </div>
      <div class="row">
        <div><label class="muted">Amount (₹)</label><input type="number" id="qty" min="1" value="14625" style="padding:8px;border-radius:8px;border:1px solid var(--border)"/></div>
        <div style="display:flex;flex-direction:column;justify-content:center"><button class="apply" id="confirmApply">Apply</button></div>
      </div>
      <div style="margin-top:12px;text-align:right"><button class="btn ghost" id="closeModal" style="background:transparent">Cancel</button></div>
    </div>
  </div>

<script>
  // Sample dynamic data
  const IPOS = [
    { id:1, symbol:'STUDDS', company:'Studds Accessories', price:'557 - 585', minAmount:14625, qty:25, date:'30th Oct - 3rd Nov', status:'ongoing' },
    { id:2, symbol:'LENSKART', company:'Lenskart Solutions', price:'382 - 402', minAmount:14874, qty:37, date:'31st Oct - 4th Nov', status:'ongoing' },
    { id:3, symbol:'MIDWESTLTD', company:'Midwest', price:'1014 - 1065', minAmount:14910, qty:14, date:'15th - 17th Oct', status:'closed' },
    { id:4, symbol:'ORKLAINDIA', company:'Orkla India', price:'695 - 730', minAmount:14600, qty:20, date:'29th - 31st Oct', status:'closed' },
    { id:5, symbol:'JAYESH', company:'Jayesh Logistics', price:'116 - 122', minAmount:244000, qty:2000, date:'27th - 29th Oct', status:'closed' },
    { id:6, symbol:'TRADEUNO', company:'Game Changers Texfab', price:'96 - 102', minAmount:244800, qty:2400, date:'28th - 30th Oct', status:'closed' },
    { id:7, symbol:'SAFE CURE', company:'Safecure Services', price:'102', minAmount:244800, qty:2400, date:'29th - 31st Oct', status:'applied' }
  ];

  const ipoList = document.getElementById('ipoList');
  const subBtns = document.querySelectorAll('.sub');
  const mainTabs = document.querySelectorAll('.tab');
  const searchInput = document.getElementById('searchInput');

  let currentSub = 'ongoing';
  let currentMain = 'ipo';
  let filterText = '';

  function renderList(){
    ipoList.innerHTML = '';
    // filter by main tab (only IPO implemented here). If others needed, extend.
    let list = IPOS.slice();

    // filter by subtab
    if(currentSub === 'ongoing') list = list.filter(i=> i.status==='ongoing');
    if(currentSub === 'applied') list = list.filter(i=> i.status==='applied');
    if(currentSub === 'upcoming') list = list.filter(i=> i.status==='upcoming');
    if(currentSub === 'all') list = IPOS.slice();

    // search filter
    if(filterText) {
      const f = filterText.toLowerCase();
      list = list.filter(i => (i.symbol + ' ' + i.company + ' ' + i.price + ' ' + i.date).toLowerCase().includes(f));
    }

    if(list.length === 0){
      ipoList.innerHTML = '<div style="padding:18px;color:var(--muted)">No IPOs found.</div>';
      return;
    }

    list.forEach(item => {
      const row = document.createElement('div'); row.className='item';
      row.innerHTML = `
        <div class="left">
          <div class="issuer">${item.company}</div>
          <div class="symbol">${item.symbol}</div>
          <div class="price">₹${item.price}</div>
          <div class="dates">${item.date}</div>
        </div>
        <div class="right">
          <div style="font-size:13px;color:var(--muted);text-align:right">Min. amount <div style="font-weight:800">₹${item.minAmount.toLocaleString()}</div></div>
          <div>
            ${item.status === 'ongoing' ? `<button class="apply" data-id="${item.id}">Apply</button>` : `<div class="closed">CLOSED</div>`}
          </div>
        </div>`;
      ipoList.appendChild(row);
    });

    // bind apply buttons
    document.querySelectorAll('.apply').forEach(btn=>{
      btn.onclick = (e) => {
        const id = +e.currentTarget.dataset.id;
        openApplyModal(id);
      };
    });
  }

  // Subtab handlers
  subBtns.forEach(b => b.addEventListener('click', () => {
    subBtns.forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentSub = b.dataset.sub;
    renderList();
  }));

  // main tabs (visual only for now)
  mainTabs.forEach(t => t.addEventListener('click', () => {
    mainTabs.forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    currentMain = t.dataset.tab;
    // For this demo, only IPO tab has content; others can be implemented similarly.
    renderList();
  }));

  // search
  searchInput.addEventListener('input', (e)=> {
    filterText = e.target.value.trim();
    renderList();
  });

  // Modal apply flow
  const modal = document.getElementById('applyModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalCompany = document.getElementById('modalCompany');
  const modalPrice = document.getElementById('modalPrice');
  const qtyInput = document.getElementById('qty');
  const confirmApply = document.getElementById('confirmApply');
  const closeModal = document.getElementById('closeModal');

  let activeIPO = null;

  function openApplyModal(id){
    activeIPO = IPOS.find(x => x.id === id);
    if(!activeIPO) return;
    modalTitle.textContent = `Apply to ${activeIPO.symbol}`;
    modalCompany.textContent = activeIPO.company;
    modalPrice.textContent = `₹${activeIPO.price}`;
    qtyInput.value = activeIPO.minAmount || 0;
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
  }
  closeModal.addEventListener('click', ()=> { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); });

  confirmApply.addEventListener('click', ()=>{
    // Mock apply behavior: mark as applied and close modal
    if(activeIPO){
      activeIPO.status = 'applied';
      modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
      renderList();
      alert(`Applied to ${activeIPO.symbol} for ₹${Number(qtyInput.value).toLocaleString()} (mock)`);
    }
  });

  // Init
  renderList();
</script>
</body>
</html>
